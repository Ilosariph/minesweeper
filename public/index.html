<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>

<div id="gameOverModal" class="modal-overlay" hidden>
  <div class="modal-box">
    <div class="modal-title">Boom!</div>
    <div class="modal-sub" id="gameOverSeedInfo"></div>
    <div class="modal-actions">
      <button id="goRetryBtn" class="btn-accent">Retry</button>
      <button id="goNewBtn">New Game</button>
      <button id="goViewBtn">View board</button>
    </div>
  </div>
</div>

<div class="top-bar">
  <h1>Mine<span>sweeper</span></h1>
  <div class="timer-info">
    <button id="darkToggle" class="icon-btn" title="Toggle dark mode">&#9790;</button>
    <div class="settings-wrap">
      <button class="icon-btn settings-btn" id="settingsBtn" title="Settings">&#9881;</button>
      <div class="settings-panel" id="settingsPanel" hidden>
        <button class="settings-item" id="noGuessItem" title="Every board is solvable by logic from a marked start cell">No-guess mode</button>
      </div>
    </div>
  </div>
</div>

<div class="top-controls">
  <div class="controls-row">
    <input type="text" id="seedInput" placeholder="seed">
    <select id="diffSelect">
      <option value="beginner">Beginner</option>
      <option value="intermediate" selected>Intermediate</option>
      <option value="expert">Expert</option>
      <option value="custom">Custom…</option>
    </select>
    <button id="retryBtn">Retry</button>
    <button class="btn-accent" id="newBtn">New</button>
  </div>
  <div class="controls-row custom-row" id="customRow" hidden>
    <label>W <input type="number" id="customW" min="5" max="50" value="20"></label>
    <label>H <input type="number" id="customH" min="5" max="50" value="20"></label>
    <label>Mines <input type="number" id="customMines" min="1" max="2491" value="70"></label>
  </div>
  <div class="seed-display">
    <span id="seedDisplay"></span>
  </div>
</div>

<!-- grows on mobile to push board + controls toward bottom of screen -->
<div class="mobile-spacer"></div>

<div class="status-bar">
  <span class="counter" title="Mines left"><i class="mine-icon"></i><b id="minesLeft">0</b></span>
  <span class="note" id="noteDisplay"></span>
  <span class="counter" id="timerDisplay" title="Time">0:00</span>
</div>

<div class="board-wrap" id="boardWrap">
  <p class="loading">Generating board&hellip;</p>
</div>

<div class="win-banner" id="winBanner"></div>

<div class="bottom-controls">
  <div class="mode-slider" id="modeSlider" data-mode="reveal" title="Reveal / flag (Space)">
    <div class="mode-slider-track">
      <div class="mode-slider-thumb"></div>
      <span class="mode-side" data-mode="flag">&#9873;</span>
      <span class="mode-side" data-mode="reveal"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 3l13 7.5-5.6 1.4 3.3 6.2-2.6 1.4-3.3-6.2L6.5 17z"/></svg></span>
    </div>
  </div>
  <p class="help">Right-click or long-press to flag &middot; click a number to chord &middot; <kbd>Space</kbd> switches mode</p>
</div>

<div class="bottom-pad"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
